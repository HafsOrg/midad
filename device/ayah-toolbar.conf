[Service]
Environment="FONTCONFIG_FILE=/home/root/ayah-toolbar/fonts.conf"
# Sorts after xovi's 00-xovi.conf and replaces its LD_PRELOAD, so xovi comes first here.
# Approved by the principal: "I approve preloading libayahfont.so into xochitl via LD_PRELOAD".
Environment="LD_PRELOAD=/home/root/xovi/xovi.so /home/root/ayah-toolbar/lib/libayahfont.so"
