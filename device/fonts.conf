<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- rm-ayah-toolbar: system config plus our Arabic font dir. xochitl gets this via
     FONTCONFIG_FILE from the xovi service drop-in ayah-toolbar.conf.
     Arabic falls back to Amiri for every family (typed text at all sizes, UI, keyboard).
     Quran and hadith paragraphs get their own fonts from the ayahfont shim instead.
     <accept> appends after the requested family, so Latin text keeps its own font. -->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <dir>/home/root/ayah-toolbar/fonts</dir>

  <alias binding="same">
    <family>reMarkable Serif Small</family>
    <accept><family>Amiri</family></accept>
  </alias>
  <alias binding="same">
    <family>Noto Serif</family>
    <accept><family>Amiri</family></accept>
  </alias>
  <alias binding="same">
    <family>reMarkable Sans</family>
    <accept><family>Amiri</family></accept>
  </alias>
</fontconfig>
